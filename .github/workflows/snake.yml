# Workflow name
name: Generate Snake

# Controls when the action will run.
on:
  # 1. Runs automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # 2. Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Step 2: Generate the snake animation
      # The output files will be saved in the 'dist' directory
      - uses: Platane/snk@v3
        with:
          # Your GitHub username. ${{ github.repository_owner }} automatically gets the owner of this repository.
          github_user_name: ${{ github.repository_owner }}

          # List of output files to generate
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Step 3: Push the contents of the 'dist' directory to the 'output' branch
      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          # A GitHub token is required to push to the repository
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          # The branch name to publish the files to
          publish_branch: output
          
          # The directory that contains the files to be published
          publish_dir: ./dist
          
          # The username and email to use for the commit
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          
          # The commit message
          commit_message: 'Generate snake animation'
